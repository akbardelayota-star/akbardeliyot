<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Akbar Gucci</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="material-logo">
                    <div class="logo-layers">
                        <div class="layer layer-1"></div>
                        <div class="layer layer-2"></div>
                        <div class="layer layer-3"></div>
                    </div>
                </div>
                <h2>Sign in</h2>
                <p>to continue to your account</p>
            </div>
            
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" required autocomplete="username">
                        <label for="username">Nama Pengguna</label>
                        <div class="input-line"></div>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                        <label for="password">Password</label>
                        <div class="input-line"></div>
                    </div>
                </div>

                <div class="form-options">
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn material-btn">
                    <span class="btn-text">SIGN IN</span>
                </button>

                <div id="alertBox" class="alert" style="display:none;"></div>
            </form>

            <div class="divider"><span>or</span></div>

            <div class="signup-link">
                <p>Don't have an account? <a href="register.html" class="create-account">Create account</a></p>
            </div>

            <div class="signup-link">
                <p><a href="../index.html">← Kembali ke Home</a></p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
